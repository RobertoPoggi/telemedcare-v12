name: HubSpot Auto Import (Form eCura)
# 🔒 IMPORT AUTOMATICO QUOTIDIANO - SOLO LEAD DA FORM ECURA
# ⏰ Esecuzione: Ogni giorno alle 05:00 IT (03:00 UTC)
# ℹ️  GitHub Actions può slittare di 2-3h → arrivo reale ~07:00-08:00 IT
# 📅 Periodo: Ultimi 7 giorni — stessa logica dell'autorefresh dashboard
# 🔍 Filtro: hs_object_source_detail_1 CONTAINS_TOKEN 'Form eCura' (IMMUTABILE)
#
# ℹ️  NOTA: imported=0 con skipped>0 è NORMALE — i lead erano già nel DB.
#    Il CRON è un safety net: se l'autorefresh dashboard li ha già caricati, skipped>0.
#    Se hubspotContacts=0: o non ci sono nuovi lead eCura negli ultimi 7 giorni
#    oppure il token è scaduto.

on:
  schedule:
    - cron: '0 3 * * *'   # 05:00 IT (03:00 UTC) — anticipo per slittamento GitHub
  workflow_dispatch:
    inputs:
      days:
        description: 'Giorni da importare (default: 7)'
        required: false
        default: '7'
        type: string
      dryRun:
        description: 'Dry Run (solo simulazione, non salva)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  import-hubspot-leads:
    name: Import Lead da Form eCura
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔄 Trigger HubSpot Auto-Import
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          DRY_RUN="${{ github.event.inputs.dryRun || 'false' }}"
          
          echo "🔄 Avvio import HubSpot..."
          echo "📅 Periodo: Ultimi $DAYS giorni"
          echo "🌐 Target: https://telemedcare-v12.pages.dev"
          echo "ℹ️  imported=0 + skipped>0 è NORMALE — lead già nel DB via autorefresh dashboard"
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://telemedcare-v12.pages.dev/api/hubspot/auto-import" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Action: true" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d "{\"days\": $DAYS, \"dryRun\": $DRY_RUN, \"enabled\": true, \"startHour\": 0}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "📊 HTTP Status: $HTTP_CODE"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
          
          SUCCESS=$(echo "$BODY" | jq -r '.success // "false"' 2>/dev/null)
          
          if [ "$SUCCESS" = "true" ]; then
            IMPORTED=$(echo "$BODY" | jq -r '.imported // 0' 2>/dev/null)
            SKIPPED=$(echo "$BODY" | jq -r '.skipped // 0' 2>/dev/null)
            UPDATED=$(echo "$BODY" | jq -r '.updated // 0' 2>/dev/null)
            ERRORS_COUNT=$(echo "$BODY" | jq -r 'if (.errors | type) == "array" then (.errors | length) else (.errors // 0) end' 2>/dev/null)
            HUBSPOT_CONTACTS=$(echo "$BODY" | jq -r '.performance.hubspotContacts // 0' 2>/dev/null)
            echo "✅ Import completato!"
            echo "📥 Nuovi: $IMPORTED | 🔄 Aggiornati: $UPDATED | ⏭️ Già presenti: $SKIPPED | ❌ Errori: $ERRORS_COUNT"
            echo "🔗 Contatti HubSpot trovati nel periodo: $HUBSPOT_CONTACTS"
            if [ "${IMPORTED}" = "0" ] && [ "${UPDATED}" = "0" ] && [ "${HUBSPOT_CONTACTS}" = "0" ]; then
              echo "⚠️  hubspotContacts=0: nessun contatto 'Form eCura' trovato su HubSpot dall'inizio campagna."
              echo "    Probabile causa: HUBSPOT_ACCESS_TOKEN scaduto."
              echo "    → Verifica su Cloudflare Pages → Settings → Environment Variables"
              echo "    → Oppure apri: GET /api/hubspot/auto-import/diagnose?days=30"
            elif [ "${IMPORTED}" = "0" ] && [ "${HUBSPOT_CONTACTS}" != "0" ]; then
              echo "ℹ️  Nessun nuovo lead: tutti i $HUBSPOT_CONTACTS contatti HubSpot erano già nel DB"
            fi
            if [ "${ERRORS_COUNT:-0}" -gt 10 ] 2>/dev/null; then
              echo "🚨 Troppi errori!"
              exit 1
            fi
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "⏭️ Switch HubSpot auto-import disabilitato"
            exit 0
          else
            echo "❌ Import fallito! (HTTP $HTTP_CODE)"
            exit 1
          fi
      
      - name: 📊 Riepilogo
        if: always()
        run: |
          echo "⏰ $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "📅 Prossima esecuzione: Domani ore 05:00 UTC (07:00-08:00 IT circa)"
          echo ""
          echo "📌 Come interpretare i risultati:"
          echo "   imported=0, updated>0  → ✅ Normale: lead già nel DB, canali aggiornati"
          echo "   imported>0             → ✅ Nuovo lead importato (non era passato dalla dashboard)"
          echo "   hubspotContacts=0      → ⚠️  Problema HubSpot API o token scaduto"
