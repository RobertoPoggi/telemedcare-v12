name: "👁️ Deploy → PREVIEW"
# Trigger: ogni push sul branch 'preview'
# Target Cloudflare: alias 'preview' del progetto telemedcare-v12
# URL: https://preview.telemedcare-v12.pages.dev
#
# PROCESSO CORRETTO:
#   1. sviluppo su branch 'test'        → deploy automatico su TEST       (deploy-test.yml)
#   2. merge test → preview             → deploy automatico su PREVIEW     (questo file)
#   3. dopo collaudo: merge preview → main → deploy automatico su PRODUCTION (deploy.yml)

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  deploy-preview:
    name: "Build & Deploy → PREVIEW"
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write

    steps:
      - name: "📋 Checkout branch preview"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js 18"
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔨 Build"
        run: npm run build

      - name: "🚀 Deploy su Cloudflare Pages — ambiente PREVIEW"
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name telemedcare-v12 --branch preview --commit-dirty=true

      - name: "✅ Riepilogo deploy PREVIEW"
        run: |
          echo "👁️ Deploy completato su PREVIEW"
          echo "🌐 URL: https://preview.telemedcare-v12.pages.dev"
          echo "📦 Commit: ${{ github.sha }}"
          echo "👤 Autore: ${{ github.actor }}"
          echo ""
          echo "⏭️  Prossimo step: collaudo su PREVIEW, poi merge preview → main per andare in PRODUZIONE"
