name: Deploy to Cloudflare Pages
# =============================================================
# PIPELINE: TEST → PREVIEW → PRODUCTION
#
# Branch  → Cloudflare alias  → URL
# test    → test-environment  → https://test-environment.telemedcare-v12.pages.dev
# preview → preview           → https://preview.telemedcare-v12.pages.dev
# main    → main (production) → https://telemedcare-v12.pages.dev
#
# PROCESSO CORRETTO DI SVILUPPO:
#   1. Lavora su branch 'test'  → verifica su TEST
#   2. Merge test → preview     → collaudo su PREVIEW
#   3. Approvazione → merge preview → main → PRODUCTION
# =============================================================

on:
  push:
    branches:
      - main      # → PRODUCTION
      - preview   # → PREVIEW
      - test      # → TEST
  workflow_dispatch:

jobs:
  deploy:
    name: "Deploy → ${{ github.ref_name == 'main' && 'PRODUCTION' || github.ref_name == 'preview' && 'PREVIEW' || 'TEST' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Determina branch Cloudflare
        id: cf_branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "label=PRODUCTION"
            echo "url=https://telemedcare-v12.pages.dev"
          elif [ "${{ github.ref_name }}" = "preview" ]; then
            echo "branch=preview" >> $GITHUB_OUTPUT
            echo "label=PREVIEW"
            echo "url=https://preview.telemedcare-v12.pages.dev"
          else
            echo "branch=test-environment" >> $GITHUB_OUTPUT
            echo "label=TEST"
            echo "url=https://test-environment.telemedcare-v12.pages.dev"
          fi

      - name: Installa Wrangler
        run: npm install -g wrangler@3

      - name: "Deploy su Cloudflare Pages"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist \
            --project-name telemedcare-v12 \
            --branch ${{ steps.cf_branch.outputs.branch }} \
            --commit-dirty=true

      - name: Riepilogo deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "PRODUCTION: https://telemedcare-v12.pages.dev"
          elif [ "${{ github.ref_name }}" = "preview" ]; then
            echo "PREVIEW: https://preview.telemedcare-v12.pages.dev"
          else
            echo "TEST: https://test-environment.telemedcare-v12.pages.dev"
          fi
          echo "Commit: ${{ github.sha }}"
