name: "Normalizza DB TEST"
on:
  push:
    branches:
      - run-normalize

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: "Prima - breakdown canale"
        run: |
          curl -s https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats

      - name: "Normalizza canale_acquisizione (one-shot endpoint)"
        run: |
          curl -s -X POST \
            -H "X-Normalize-Token: a98f69516b066619ffeb3ab4624b2333" \
            -H "Content-Type: application/json" \
            https://test-environment.telemedcare-v12.pages.dev/api/normalize-canale-run

      - name: "Dopo - breakdown canale"
        run: |
          curl -s https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats
