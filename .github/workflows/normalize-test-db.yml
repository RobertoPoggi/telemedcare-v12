name: "[ONE-SHOT] Normalizza canale_acquisizione DB di TEST"
# Esegue una chiamata HTTP all'endpoint /api/admin/normalize-canale sul DB di TEST.
# Autenticazione via X-Cron-Secret (non richiede ADMIN_SECRET_TOKEN).
# Da eseguire UNA SOLA VOLTA manualmente via workflow_dispatch.
# Idempotente: rieseguirlo non causa danni.

on:
  workflow_dispatch:

jobs:
  normalize:
    name: "Normalizza canale_acquisizione → DB TEST"
    runs-on: ubuntu-latest
    steps:
      - name: "Chiama /api/admin/normalize-canale su TEST"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "=== Stato PRIMA della normalizzazione ==="
          curl -s "https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)
print('breakdown canale_acquisizione nel DB di TEST:')
for b in d.get('breakdown',[]):
    print(f\"  '{b['label']}' → {b['count']}\")
print(f\"nonTracciato = {d.get('nonTracciato', 0)}\")
"

          echo ""
          echo "=== Eseguo normalizzazione ==="
          curl -s -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            "https://test-environment.telemedcare-v12.pages.dev/api/admin/normalize-canale" | \
            python3 -m json.tool

          echo ""
          echo "=== Stato DOPO la normalizzazione ==="
          curl -s "https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats" | \
            python3 -c "
import sys,json
d=json.load(sys.stdin)
print('breakdown canale_acquisizione nel DB di TEST:')
for b in d.get('breakdown',[]):
    print(f\"  '{b['label']}' → {b['count']}\")
print(f\"nonTracciato = {d.get('nonTracciato', 0)}\")
"
