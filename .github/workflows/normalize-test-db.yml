name: "Normalizza DB TEST"
on:
  push:
    branches:
      - run-normalize

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: "Prima - breakdown canale"
        run: |
          curl -s https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats

      - name: "Normalizza canale_acquisizione"
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -s -X POST \
            -H "X-Cron-Secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            https://test-environment.telemedcare-v12.pages.dev/api/admin/normalize-canale

      - name: "Dopo - breakdown canale"
        run: |
          curl -s https://test-environment.telemedcare-v12.pages.dev/api/leads/channel-stats
