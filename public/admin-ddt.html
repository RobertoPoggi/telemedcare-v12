<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione DDT | TeleMedCare V12</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background: #f1f5f9; }
    .badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-consegnato   { background: #dcfce7; color: #166534; }
    .badge-spedito      { background: #fef9c3; color: #854d0e; }
    .badge-preparazione { background: #dbeafe; color: #1e40af; }
    .badge-annullato    { background: #fee2e2; color: #991b1b; }
    .badge-default      { background: #f3f4f6; color: #374151; }
    tr:hover td { background: #f8fafc; }
    .sortable { cursor: pointer; user-select: none; }
    .sortable:hover { color: #0d9488; }
    .kpi-card { min-width: 80px; text-align: center; }
  </style>
</head>
<body class="min-h-screen">

<!-- NAVBAR -->
<nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-14">
      <div class="flex items-center gap-3">
        <a href="/home" class="text-gray-400 hover:text-teal-600 transition-colors text-sm">
          <i class="fas fa-home mr-1"></i>Home
        </a>
        <span class="text-gray-300">/</span>
        <span class="text-gray-700 font-semibold text-sm">
          <i class="fas fa-truck mr-1 text-teal-600"></i>Gestione DDT
        </span>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <a href="/home" class="text-sm bg-gray-50 hover:bg-gray-100 text-gray-700 border border-gray-200 px-3 py-1.5 rounded-lg transition-colors">
          <i class="fas fa-home mr-1"></i>Dashboard
        </a>
        <a href="/admin/devices" class="text-sm bg-cyan-50 hover:bg-cyan-100 text-cyan-700 border border-cyan-200 px-3 py-1.5 rounded-lg transition-colors">
          <i class="fas fa-mobile-alt mr-1"></i>Dispositivi
        </a>
        <button onclick="openCreateModal()" class="text-sm bg-teal-500 hover:bg-teal-600 text-white px-3 py-1.5 rounded-lg transition-colors">
          <i class="fas fa-plus mr-1"></i>Nuovo DDT
        </button>
        <button onclick="exportCSV()" class="text-sm bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 px-3 py-1.5 rounded-lg transition-colors">
          <i class="fas fa-download mr-1"></i>CSV
        </button>
        <button onclick="loadDDTs()" class="text-sm bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-3 py-1.5 rounded-lg transition-colors">
          <i class="fas fa-sync mr-1"></i>Aggiorna
        </button>
      </div>
    </div>
  </div>
</nav>

<!-- MAIN -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

  <!-- HEADER + KPI -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">
        <i class="fas fa-truck text-teal-600 mr-2"></i>Documenti di Trasporto (DDT)
      </h1>
      <p class="text-gray-500 text-sm mt-1">Storico spedizioni dispositivi SiDLY</p>
    </div>
    <div class="flex gap-3">
      <div class="bg-white rounded-lg px-4 py-2 shadow-sm border kpi-card">
        <div class="text-2xl font-bold text-gray-800" id="kpiTotal">—</div>
        <div class="text-xs text-gray-500">Totali</div>
      </div>
      <div class="bg-white rounded-lg px-4 py-2 shadow-sm border kpi-card">
        <div class="text-2xl font-bold text-green-600" id="kpiConsegnati">—</div>
        <div class="text-xs text-gray-500">Consegnati</div>
      </div>
      <div class="bg-white rounded-lg px-4 py-2 shadow-sm border kpi-card">
        <div class="text-2xl font-bold text-yellow-600" id="kpiSpediti">—</div>
        <div class="text-xs text-gray-500">In transito</div>
      </div>
      <div class="bg-white rounded-lg px-4 py-2 shadow-sm border kpi-card">
        <div class="text-2xl font-bold text-blue-600" id="kpiPreparazione">—</div>
        <div class="text-xs text-gray-500">In prep.</div>
      </div>
    </div>
  </div>

  <!-- FILTRI -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Cerca</label>
        <input id="searchInput" type="text" placeholder="Destinatario, n° DDT, S/N…"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400"
          oninput="applyFilters()">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Stato</label>
        <select id="statusFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" onchange="applyFilters()">
          <option value="">Tutti</option>
          <option value="consegnato">Consegnato</option>
          <option value="spedito">Spedito</option>
          <option value="preparazione">In preparazione</option>
          <option value="annullato">Annullato</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Dispositivo</label>
        <select id="deviceFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" onchange="applyFilters()">
          <option value="">Tutti</option>
          <option value="SiDLY CARE PRO">SiDLY CARE PRO</option>
          <option value="SiDLY VITAL CARE">SiDLY VITAL CARE</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Anno</label>
        <select id="yearFilter" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-400" onchange="applyFilters()">
          <option value="">Tutti</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
        </select>
      </div>
    </div>
    <div class="flex items-center justify-between mt-3">
      <span class="text-xs text-gray-500" id="resultCount"></span>
      <button onclick="resetFilters()" class="text-xs text-gray-400 hover:text-gray-600 underline">
        <i class="fas fa-times mr-1"></i>Azzera filtri
      </button>
    </div>
  </div>

  <!-- TABELLA -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider sortable" onclick="sortTable('numero_ddt')">
              N° DDT <i class="fas fa-sort ml-1 text-gray-300" id="sort-numero_ddt"></i>
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider sortable" onclick="sortTable('created_at')">
              Data <i class="fas fa-sort ml-1 text-gray-300" id="sort-created_at"></i>
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              Destinatario
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              Città
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider sortable" onclick="sortTable('dispositivo')">
              Dispositivo <i class="fas fa-sort ml-1 text-gray-300" id="sort-dispositivo"></i>
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              S/N · IMEI
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              Contratto
            </th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider sortable" onclick="sortTable('status')">
              Stato <i class="fas fa-sort ml-1 text-gray-300" id="sort-status"></i>
            </th>
            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">
              Azioni
            </th>
          </tr>
        </thead>
        <tbody id="ddtTableBody" class="divide-y divide-gray-100">
          <tr>
            <td colspan="9" class="px-4 py-10 text-center text-gray-400">
              <i class="fas fa-spinner fa-spin text-2xl mb-2 block"></i>
              Caricamento DDT…
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="px-4 py-3 border-t border-gray-100 bg-gray-50 flex items-center justify-between">
      <span class="text-xs text-gray-500" id="tableFooter">—</span>
    </div>
  </div>
</div>

<!-- MODAL CRUD (Create/Edit) -->
<div id="crudModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-4 border-b sticky top-0 bg-white z-10">
      <h3 class="text-lg font-bold text-gray-800" id="crudModalTitle">DDT</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
    </div>
    <div class="px-6 py-5" id="crudModalBody"></div>
    <div class="px-6 py-4 border-t flex justify-end gap-2" id="crudModalFooter"></div>
  </div>
</div>

<!-- MODAL DETTAGLIO -->
<div id="detailModal" class="fixed inset-0 z-50 hidden bg-black bg-opacity-40 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between px-6 py-4 border-b sticky top-0 bg-white z-10">
      <h3 class="text-lg font-bold text-gray-800" id="modalTitle">Dettaglio DDT</h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl"><i class="fas fa-times"></i></button>
    </div>
    <div class="px-6 py-5" id="modalBody"></div>
    <div class="px-6 py-4 border-t flex justify-end gap-2" id="modalFooter">
      <button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Chiudi</button>
    </div>
  </div>
</div>

<script>
var allDDTs = [];
var filteredDDTs = [];
var sortField = 'created_at';
var sortDir = -1;

async function loadDDTs() {
  try {
    var res = await fetch('/api/ddts');
    var data = await res.json();
    if (!data.success) throw new Error(data.error || 'Errore API');
    allDDTs = data.ddts || [];
    applyFilters();
    updateKPIs();
  } catch(e) {
    document.getElementById('ddtTableBody').innerHTML =
      '<tr><td colspan="9" class="px-4 py-10 text-center text-red-500"><i class="fas fa-exclamation-triangle mr-2"></i>' + e.message + '</td></tr>';
  }
}

function updateKPIs() {
  var counts = { consegnato: 0, spedito: 0, preparazione: 0 };
  allDDTs.forEach(function(d) {
    if (counts[d.status] !== undefined) counts[d.status]++;
  });
  document.getElementById('kpiTotal').textContent = allDDTs.length;
  document.getElementById('kpiConsegnati').textContent = counts.consegnato;
  document.getElementById('kpiSpediti').textContent = counts.spedito;
  document.getElementById('kpiPreparazione').textContent = counts.preparazione;
}

function applyFilters() {
  var search = document.getElementById('searchInput').value.toLowerCase().trim();
  var status = document.getElementById('statusFilter').value;
  var device = document.getElementById('deviceFilter').value;
  var year   = document.getElementById('yearFilter').value;

  filteredDDTs = allDDTs.filter(function(d) {
    if (status && d.status !== status) return false;
    if (device && (d.dispositivo || '').indexOf(device) === -1) return false;
    if (year) {
      var dateStr = d.created_at || d.data_spedizione || '';
      if (dateStr.indexOf(year) === -1) return false;
    }
    if (search) {
      var haystack = [d.numero_ddt, d.destinatario_nome, d.destinatario_citta,
        d.serial_number, d.dispositivo, d.contract_code, d.tracking_number].join(' ').toLowerCase();
      if (haystack.indexOf(search) === -1) return false;
    }
    return true;
  });

  sortData();
  renderTable();
  document.getElementById('resultCount').textContent =
    filteredDDTs.length + ' DDT trovati' + (filteredDDTs.length !== allDDTs.length ? ' su ' + allDDTs.length : '');
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('deviceFilter').value = '';
  document.getElementById('yearFilter').value = '';
  applyFilters();
}

function sortTable(field) {
  if (sortField === field) sortDir *= -1;
  else { sortField = field; sortDir = -1; }
  document.querySelectorAll('[id^="sort-"]').forEach(function(el) {
    el.className = 'fas fa-sort ml-1 text-gray-300';
  });
  var icon = document.getElementById('sort-' + field);
  if (icon) icon.className = 'fas fa-sort-' + (sortDir === 1 ? 'up' : 'down') + ' ml-1 text-teal-500';
  sortData();
  renderTable();
}

function sortData() {
  filteredDDTs.sort(function(a, b) {
    var va = (a[sortField] || '').toString();
    var vb = (b[sortField] || '').toString();
    return va.localeCompare(vb) * sortDir;
  });
}

function statusBadge(s) {
  var map = {
    consegnato:   ['badge-consegnato',   'fa-check-circle',  'Consegnato'],
    spedito:      ['badge-spedito',      'fa-shipping-fast', 'Spedito'],
    preparazione: ['badge-preparazione', 'fa-box-open',      'In preparazione'],
    annullato:    ['badge-annullato',    'fa-times-circle',  'Annullato']
  };
  var entry = map[s] || ['badge-default', 'fa-question-circle', s || 'N/D'];
  return '<span class="badge ' + entry[0] + '"><i class="fas ' + entry[1] + ' mr-1"></i>' + entry[2] + '</span>';
}

function fmtDate(str) {
  if (!str) return '—';
  try {
    return new Date(str).toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch(e) { return str; }
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderTable() {
  var tbody = document.getElementById('ddtTableBody');
  if (filteredDDTs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" class="px-4 py-10 text-center text-gray-400"><i class="fas fa-inbox text-3xl mb-2 block"></i>Nessuna DDT trovata</td></tr>';
    document.getElementById('tableFooter').textContent = '0 risultati';
    return;
  }

  var html = '';
  filteredDDTs.forEach(function(d) {
    var sn = d.serial_number || '—';
    var snShort = sn.length > 16 ? sn.substring(0, 15) + '…' : sn;
    var city = [d.destinatario_citta, d.destinatario_provincia ? '(' + d.destinatario_provincia + ')' : ''].filter(Boolean).join(' ') || '—';
    var contractLink = d.contract_code
      ? '<a href="/admin/leads-dashboard" class="text-teal-600 hover:underline font-mono text-xs">' + esc(d.contract_code) + '</a>'
      : '<span class="text-gray-300 text-xs">—</span>';
    var pdfBtn = d.pdf_url
      ? '<a href="' + esc(d.pdf_url) + '" target="_blank" class="text-blue-600 hover:text-blue-800 mr-2" title="PDF"><i class="fas fa-file-pdf"></i></a>'
      : '';
    var viewBtn = '<a href="/ddt-view?id=' + encodeURIComponent(d.id || d.numero_ddt) + '" target="_blank" class="text-gray-500 hover:text-gray-700 mr-2" title="Visualizza"><i class="fas fa-eye"></i></a>';
    var rowId = esc(d.id || d.numero_ddt);

    html += '<tr>';
    html += '<td class="px-4 py-3 font-mono text-xs text-gray-800 whitespace-nowrap">' + esc(d.numero_ddt || '—') + '</td>';
    html += '<td class="px-4 py-3 text-xs text-gray-600 whitespace-nowrap">' + fmtDate(d.created_at) + '</td>';
    html += '<td class="px-4 py-3 text-sm font-medium text-gray-900">' + esc(d.destinatario_nome || '—') + '</td>';
    html += '<td class="px-4 py-3 text-xs text-gray-600">' + esc(city) + '</td>';
    html += '<td class="px-4 py-3 text-xs text-gray-700">' + esc(d.dispositivo || '—') + '</td>';
    html += '<td class="px-4 py-3 font-mono text-xs text-gray-500" title="' + esc(sn) + '">' + esc(snShort) + '</td>';
    html += '<td class="px-4 py-3">' + contractLink + '</td>';
    html += '<td class="px-4 py-3">' + statusBadge(d.status) + '</td>';
    html += '<td class="px-4 py-3 text-center whitespace-nowrap">' + pdfBtn + viewBtn;
    html += '<button onclick="showDetail(' + "'" + rowId + "'" + ')" class="text-gray-400 hover:text-teal-600 mr-1" title="Dettaglio"><i class="fas fa-info-circle"></i></button>';
    html += '<button onclick="openEditModal(' + "'" + rowId + "'" + ')" class="text-green-500 hover:text-green-700 mr-1" title="Modifica"><i class="fas fa-edit"></i></button>';
    html += '<button onclick="confirmDelete(' + "'" + rowId + "'" + ')" class="text-red-400 hover:text-red-600" title="Elimina"><i class="fas fa-trash"></i></button>';
    html += '</td></tr>';
  });

  tbody.innerHTML = html;
  document.getElementById('tableFooter').textContent =
    'Visualizzati ' + filteredDDTs.length + ' di ' + allDDTs.length + ' DDT';
}

function showDetail(id) {
  var d = null;
  for (var i = 0; i < allDDTs.length; i++) {
    if (allDDTs[i].id === id || allDDTs[i].numero_ddt === id) { d = allDDTs[i]; break; }
  }
  if (!d) return;

  document.getElementById('modalTitle').textContent = 'DDT ' + (d.numero_ddt || d.id);

  var rows = [
    ['N° DDT', d.numero_ddt],
    ['Data', fmtDate(d.created_at)],
    ['Destinatario', d.destinatario_nome],
    ['Indirizzo', [d.destinatario_indirizzo, d.destinatario_cap, d.destinatario_citta, d.destinatario_provincia].filter(Boolean).join(', ')],
    ['Telefono', d.destinatario_telefono],
    ['Email', d.destinatario_email],
    ['Dispositivo', d.dispositivo],
    ['S/N · IMEI', d.serial_number],
    ['Quantità', d.quantita],
    ['Corriere', d.corriere],
    ['Tracking', d.tracking_number],
    ['Contratto', d.contract_code],
    ['Proforma', d.proforma_number],
    ['Stato', d.status],
    ['Data spedizione', fmtDate(d.data_spedizione)],
    ['Data consegna', fmtDate(d.data_consegna)],
    ['Note', d.note]
  ].filter(function(r) { return r[1] && r[1] !== 'null' && r[1] !== 'undefined'; });

  var dlHtml = '<dl class="grid grid-cols-2 gap-x-4 gap-y-2 text-sm">';
  rows.forEach(function(r) {
    dlHtml += '<dt class="text-gray-500 font-medium">' + esc(r[0]) + '</dt>';
    dlHtml += '<dd class="text-gray-800 break-words">' + esc(String(r[1])) + '</dd>';
  });
  dlHtml += '</dl>';
  document.getElementById('modalBody').innerHTML = dlHtml;

  var btns = '';
  if (d.pdf_url) {
    btns += '<a href="' + esc(d.pdf_url) + '" target="_blank" class="px-4 py-2 text-sm bg-blue-600 hover:bg-blue-700 text-white rounded-lg"><i class="fas fa-file-pdf mr-1"></i>PDF</a>';
  }
  btns += '<a href="/ddt-view?id=' + encodeURIComponent(d.id || d.numero_ddt) + '" target="_blank" class="px-4 py-2 text-sm bg-teal-600 hover:bg-teal-700 text-white rounded-lg"><i class="fas fa-eye mr-1"></i>Visualizza DDT</a>';
  btns += '<button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Chiudi</button>';
  document.getElementById('modalFooter').innerHTML = btns;

  document.getElementById('detailModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('detailModal').classList.add('hidden');
  document.getElementById('crudModal').classList.add('hidden');
}

document.getElementById('detailModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── CRUD FUNCTIONS ────────────────────────────────────────────
function getCrudFormHtml(d) {
  d = d || {};
  return '<div class="grid grid-cols-2 gap-3 text-sm">' +
    '<div class="col-span-2 sm:col-span-1"><label class="font-semibold text-gray-600">Destinatario *</label>' +
    '<input name="destinatario_nome" value="' + esc(d.destinatario_nome||'') + '" required class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"></div>' +
    '<div><label class="font-semibold text-gray-600">Indirizzo</label>' +
    '<input name="destinatario_indirizzo" value="' + esc(d.destinatario_indirizzo||'') + '" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"></div>' +
    '<div><label class="font-semibold text-gray-600">CAP</label>' +
    '<input name="destinatario_cap" value="' + esc(d.destinatario_cap||'') + '" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"></div>' +
    '<div><label class="font-semibold text-gray-600">Città</label>' +
    '<input name="destinatario_citta" value="' + esc(d.destinatario_citta||'') + '" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"></div>' +
    '<div><label class="font-semibold text-gray-600">Provincia</label>' +
    '<input name="destinatario_provincia" value="' + esc(d.destinatario_provincia||'') + '" maxlength="2" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm"></div>' +
    '<div><label class="font-semibold text-gray-600">Dispositivo *</label>' +
    '<select name="dispositivo" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">' +
    '<option value="SiDLY CARE PRO"' + (d.dispositivo==='SiDLY CARE PRO'?' selected':'') + '>SiDLY CARE PRO</option>' +
    '<option value="SiDLY VITAL CARE"' + (d.dispositivo==='SiDLY VITAL CARE'?' selected':'') + '>SiDLY VITAL CARE</option>' +
    '</select></div>' +
    '<div><label class="font-semibold text-gray-600">IMEI / S/N</label>' +
    '<input name="serial_number" value="' + esc(d.serial_number||'') + '" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm font-mono"></div>' +
    '<div><label class="font-semibold text-gray-600">Stato</label>' +
    '<select name="status" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">' +
    '<option value="preparazione"' + (d.status==='preparazione'?' selected':'') + '>In preparazione</option>' +
    '<option value="spedito"' + (d.status==='spedito'?' selected':'') + '>Spedito</option>' +
    '<option value="consegnato"' + (d.status==='consegnato'?' selected':'') + '>Consegnato</option>' +
    '<option value="annullato"' + (d.status==='annullato'?' selected':'') + '>Annullato</option>' +
    '</select></div>' +
    '<div class="col-span-2"><label class="font-semibold text-gray-600">URL PDF</label>' +
    '<input name="pdf_url" value="' + esc(d.pdf_url||'') + '" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm" placeholder="/contratti/file.pdf"></div>' +
    '<div class="col-span-2"><label class="font-semibold text-gray-600">Note / Rif. Contratto</label>' +
    '<textarea name="note" rows="2" class="mt-1 w-full border rounded-lg px-3 py-2 text-sm">' + esc(d.note||'') + '</textarea></div>' +
    '</div>';
}

function openCreateModal() {
  document.getElementById('crudModalTitle').textContent = 'Nuovo DDT';
  document.getElementById('crudModalBody').innerHTML = '<form id="crudForm">' + getCrudFormHtml() + '</form>';
  document.getElementById('crudModalFooter').innerHTML =
    '<button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Annulla</button>' +
    '<button onclick="submitCreateDDT()" class="px-4 py-2 text-sm bg-teal-500 hover:bg-teal-600 text-white rounded-lg ml-2"><i class="fas fa-plus mr-1"></i>Crea DDT</button>';
  document.getElementById('crudModal').classList.remove('hidden');
}

async function submitCreateDDT() {
  var form = document.getElementById('crudForm');
  if (!form || !form.checkValidity()) { if(form) form.reportValidity(); return; }
  var fd = new FormData(form);
  var payload = {};
  fd.forEach(function(v, k) { payload[k] = v; });
  payload.quantita = 1;
  try {
    var res = await fetch('/api/ddts', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    var data = await res.json();
    if (data.success) { closeModal(); loadDDTs(); showToast('DDT creato con successo', 'success'); }
    else showToast('Errore: ' + (data.error||'Sconosciuto'), 'error');
  } catch(e) { showToast('Errore di rete', 'error'); }
}

function openEditModal(id) {
  var d = null;
  for (var i = 0; i < allDDTs.length; i++) {
    if (allDDTs[i].id === id || allDDTs[i].numero_ddt === id) { d = allDDTs[i]; break; }
  }
  if (!d) return;
  document.getElementById('crudModalTitle').textContent = 'Modifica DDT ' + (d.numero_ddt||d.id);
  document.getElementById('crudModalBody').innerHTML = '<form id="crudForm">' + getCrudFormHtml(d) + '</form>';
  document.getElementById('crudModalFooter').innerHTML =
    '<button onclick="closeModal()" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg">Annulla</button>' +
    '<button onclick="submitEditDDT(' + "'" + esc(d.id||d.numero_ddt) + "'" + ')" class="px-4 py-2 text-sm bg-green-500 hover:bg-green-600 text-white rounded-lg ml-2"><i class="fas fa-save mr-1"></i>Salva</button>';
  document.getElementById('crudModal').classList.remove('hidden');
}

async function submitEditDDT(id) {
  var form = document.getElementById('crudForm');
  if (!form) return;
  var fd = new FormData(form);
  var payload = {};
  fd.forEach(function(v, k) { payload[k] = v; });
  try {
    var res = await fetch('/api/ddts/' + id, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    var data = await res.json();
    if (data.success) { closeModal(); loadDDTs(); showToast('DDT aggiornato', 'success'); }
    else showToast('Errore: ' + (data.error||'Sconosciuto'), 'error');
  } catch(e) { showToast('Errore di rete', 'error'); }
}

async function confirmDelete(id) {
  if (!confirm('Eliminare il DDT ' + id + '? Questa azione non può essere annullata.')) return;
  try {
    var res = await fetch('/api/ddts/' + id, { method: 'DELETE' });
    var data = await res.json();
    if (data.success) { loadDDTs(); showToast('DDT eliminato', 'success'); }
    else showToast('Errore: ' + (data.error||'Sconosciuto'), 'error');
  } catch(e) { showToast('Errore di rete', 'error'); }
}

function showToast(msg, type) {
  var existing = document.getElementById('toastMsg');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.id = 'toastMsg';
  t.style = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;padding:0.75rem 1.25rem;border-radius:0.75rem;color:#fff;font-weight:600;font-size:0.875rem;' + (type==='success'?'background:#22c55e':'background:#ef4444');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 3000);
}

function exportCSV() {
  var headers = ['N° DDT','Data','Destinatario','Città','Prov','Dispositivo','S/N','Contratto','Stato','Note'];
  var csvRows = [headers];
  filteredDDTs.forEach(function(d) {
    csvRows.push([
      d.numero_ddt || '',
      fmtDate(d.created_at),
      d.destinatario_nome || '',
      d.destinatario_citta || '',
      d.destinatario_provincia || '',
      d.dispositivo || '',
      d.serial_number || '',
      d.contract_code || '',
      d.status || '',
      (d.note || '').replace(/,/g, ';').replace(/\n/g, ' ')
    ]);
  });
  var csv = csvRows.map(function(r) {
    return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'DDT_TeleMedCare_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

loadDDTs();
</script>
